<script type="module" src="/src/main.ts"></script>

<script>
    // 1. CONFIGURAÇÃO (Coloque suas chaves aqui)

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 2. FUNÇÃO DE VOZ E REGISTRO NO BANCO
    async function falar(texto, acao) {
        // Faz o celular falar
        const mensagem = new SpeechSynthesisUtterance(texto);
        mensagem.lang = 'pt-BR';
        window.speechSynthesis.speak(mensagem);
        
        // Salva o alerta no banco de dados em tempo real
        const { data, error } = await supabase
            .from('alertas_acessibilidade')
            .insert([{ tipo_alerta: acao }]);

        if (error) {
            console.error("Erro ao enviar alerta:", error);
        } else {
            console.log("Alerta enviado com sucesso para o cuidador!");
        }
    }
</script>
